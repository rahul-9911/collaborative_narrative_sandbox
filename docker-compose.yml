version: '3.8'

services:
  # StoryForge Backend & Frontend
  app:
    build: .
    container_name: storyforge_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - DB_HOST=db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_PROVIDER=${AI_PROVIDER}
      - LOCAL_AI_URL=http://ollama:11434
      - LOCAL_MODEL_NAME=${LOCAL_MODEL_NAME}
    depends_on:
      - db
      - ollama
    networks:
      - storyforge_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Local AI Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: storyforge_local_ai
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      storyforge_net:
        aliases:
          - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # PostgreSQL Database
  db:
    image: postgres:16
    container_name: storyforge_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - storyforge_net

networks:
  storyforge_net:
    driver: bridge

volumes:
  pgdata:
  ollama_data:
